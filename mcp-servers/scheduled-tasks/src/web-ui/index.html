<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scheduled Tasks - MCP Web UI</title>
    <link rel="stylesheet" href="../../../../../mcp-web-ui-standalone/templates/static/styles.css">
    <style>
        /* Schedule-specific styles */
        .schedule-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .schedule-icon {
            font-size: 1.1em;
        }

        .task-status.enabled {
            color: #059669;
        }

        .task-status.disabled {
            color: #6b7280;
        }

        .task-status.overdue {
            color: #dc2626;
        }

        .next-run.overdue {
            color: #dc2626;
            font-weight: 600;
        }

        .status-indicator {
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-indicator.overdue {
            background-color: #fee2e2;
            color: #dc2626;
        }

        .status-indicator.upcoming {
            background-color: #dbeafe;
            color: #2563eb;
        }

        .status-indicator.disabled {
            background-color: #f3f4f6;
            color: #6b7280;
        }

        .schedule-meta {
            font-size: 0.875rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }

        .schedule-meta span {
            margin-right: 1rem;
        }
    </style>
</head>

<body>
    <div id="schedule-app">
        <div id="schedule-list"></div>
    </div>

    <!-- Load MCP Web UI Framework components FIRST -->
    <script src="../../../../../mcp-web-ui-standalone/src/vanilla/core/BaseComponent.js"></script>
    <script src="../../../../../mcp-web-ui-standalone/src/vanilla/components/ListComponent.js"></script>

    <!-- Load server-specific components AFTER framework -->
    <script src="ScheduleListComponent.js"></script>

    <script>
        // Example usage
        document.addEventListener('DOMContentLoaded', function () {
            // Sample scheduled tasks data
            const scheduleData = [
                {
                    id: '1',
                    name: 'Daily Backup',
                    description: 'Backup important files to cloud storage',
                    schedule: {
                        type: 'daily',
                        time: '02:00'
                    },
                    nextRun: '2024-01-15T02:00:00Z',
                    lastRun: '2024-01-14T02:00:00Z',
                    enabled: true
                },
                {
                    id: '2',
                    name: 'Weekly Report',
                    description: 'Generate and send weekly summary report',
                    schedule: {
                        type: 'weekly',
                        weekdays: ['Monday'],
                        time: '09:00'
                    },
                    nextRun: '2024-01-15T09:00:00Z',
                    lastRun: '2024-01-08T09:00:00Z',
                    enabled: true
                },
                {
                    id: '3',
                    name: 'Database Cleanup',
                    description: 'Clean up old database records',
                    schedule: {
                        type: 'monthly',
                        dayOfMonth: 1,
                        time: '01:00'
                    },
                    nextRun: '2024-02-01T01:00:00Z',
                    lastRun: '2024-01-01T01:00:00Z',
                    enabled: false
                },
                {
                    id: '4',
                    name: 'Cache Refresh',
                    description: 'Refresh application cache',
                    schedule: {
                        type: 'interval',
                        interval: { value: 30, unit: 'minutes' }
                    },
                    nextRun: '2024-01-14T14:30:00Z',
                    lastRun: '2024-01-14T14:00:00Z',
                    enabled: true
                },
                {
                    id: '5',
                    name: 'Custom Cron Job',
                    description: 'Complex scheduling via cron expression',
                    schedule: {
                        type: 'cron',
                        cronExpression: '0 */4 * * 1-5'
                    },
                    nextRun: '2024-01-15T16:00:00Z',
                    lastRun: '2024-01-15T12:00:00Z',
                    enabled: true
                }
            ];

            // Initialize schedule list with all features
            const scheduleListElement = document.getElementById('schedule-list');
            const scheduleList = createScheduleListComponent(scheduleListElement, scheduleData, {
                list: {
                    enableSearch: true,
                    enableFilters: true,
                    enableBulkActions: true,
                    enableSorting: true,
                    actions: {
                        item: ['edit', 'delete', 'run', 'toggle'],
                        bulk: ['delete', 'enable', 'disable'],
                        global: ['add', 'import']
                    }
                },
                schedule: {
                    autoUpdate: true,
                    updateInterval: 30000, // Update every 30 seconds
                    timeFormat: '12h',
                    highlightUpcoming: true
                }
            });

            console.log('Schedule list component initialized with auto-update');

            // Example of handling custom actions
            scheduleList.on('action', (event) => {
                console.log('Schedule action:', event.detail);

                switch (event.detail.action) {
                    case 'run_task':
                        alert(`Running task: ${event.detail.data.id}`);
                        break;
                    case 'bulk_enable':
                        alert(`Enabling ${event.detail.data.ids.length} tasks`);
                        break;
                    case 'bulk_disable':
                        alert(`Disabling ${event.detail.data.ids.length} tasks`);
                        break;
                }
            });
        });
    </script>
</body>

</html>
