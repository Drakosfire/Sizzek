    #     stream: true
    #   dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]
    #   headers:
    #     Authorization: "Bearer no-key"
    
    - name: "ollama"
      apiKey: "ollama"
      baseURL: "http://172.17.0.1:11434/v1"
      models:
        default: [ "bitagent", "qwen3:14b", "phi4-mini", "qwen2.5:14b", "xlam-2-3b" ]
        fetch: true
      titleConvo: false
      titleModel: "current_model"
      summarize: false
      summaryModel: "current_model"
      forcePrompt: false
      modelDisplayLabel: "Ollama"
      directEndpoint: true
     
  agents:
    capabilities: ["execute_code", "file_search", "actions", "tools"]

speech:
  stt:
    openai:
      apiKey: '${STT_API_KEY}'
      model: 'whisper-1'
  tts:
    localai:
      url: "http://172.17.0.1:8002/v1/audio/speech/stream"
      voices: ["test_voice", "Karlach_v1", "Gale_v1", "Astarion_v1", "Kirkv1"]
      backend: 'zonos'
      apiKey: ''  # Zonos API doesn't require authentication
  speechTab:
    conversationMode: true
    advancedMode: false
    speechToText:
      engineSTT: "openai"
      languageSTT: "English (US)"
      autoTranscribeAudio: true
      decibelValue: -45
      autoSendText: 0

mcpServers:
  remember:
    type: stdio
    command: node
    args:
      - "../Sizzek/mcp-servers/memory/dist/index.js"
    timeout: 30000
    initTimeout: 10000
    stderr: inherit

  todoodles:
    type: stdio
    command: node
    args:
      - "../Sizzek/mcp-servers/todoodles/dist/index.js"
    timeout: 30000
    initTimeout: 10000
    env:
        # NODE_ENV: "production"
        TODOS_FILE_PATH: "../Sizzek/memory_files/todoodles.json"
    stderr: inherit

  twilio-sms:
    type: stdio
    command: node
    args:
      - "../Sizzek/mcp-servers/twilio-sms/dist/index.js"

  google-calendar:
    type: stdio
    command: node
    args:
      - "../Sizzek/mcp-servers/google-calendar-mcp/build/index.js"
    timeout: 30000
    initTimeout: 10000
    env:
        GOOGLE_CALENDAR_API_KEY: "../Sizzek/credentials/client_secret_343086464830-3k2nk6n9bhjc0vvuut4cb6lnklfb5b69.apps.googleusercontent.com.json"

  scheduled-tasks:
    type: stdio
    command: node
    args:
      - "../Sizzek/mcp-servers/scheduled-tasks/dist/src/index.js"
    timeout: 30000
    initTimeout: 10000
    stderr: inherit
  
  grocery-list:
    type: stdio
    command: node
    args:
      - "../Sizzek/mcp-servers/grocery-list/dist/index.js"
    timeout: 30000
    initTimeout: 10000
    stderr: inherit

  movies:
    type: stdio
    command: node
    args:
      - "../Sizzek/mcp-servers/movies/dist/index.js"
    timeout: 30000
    initTimeout: 10000
    stderr: inherit